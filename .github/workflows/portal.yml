name: Portal build
# Zip for game portals (itch.io, CrazyGames): relative asset paths so it runs
# from any folder. Download the "portal-build" artifact from the run page.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:portal
        env:
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: portal-build
          path: dist-portal
      # Push to itch.io (yuusha-games/fjordbattle) when the BUTLER_API_KEY secret is set.
      - name: Push to itch.io
        if: env.BUTLER_API_KEY != ''
        run: |
          curl -sSL -o butler.zip https://broth.itch.zone/butler/linux-amd64/LATEST/archive/default
          unzip -q butler.zip -d butler && chmod +x butler/butler
          ./butler/butler push dist-portal yuusha-games/fjordbattle:html5 --userversion "$(git rev-parse --short HEAD)"
